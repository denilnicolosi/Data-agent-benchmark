[project]
name = "benchmark-agent"
version = "0.1.0"
description = "Parallel data processing benchmark agent with LangGraph and Aegra"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain>=1.0",
    "langchain-openai>=0.1.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "matplotlib>=3.8.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "aegra>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_agent"]
